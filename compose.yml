services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cleanmaster_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cleanmaster_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - vendor_data:/app/vendor
      - node_modules_data:/app/node_modules
    working_dir: /app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cleanmaster_admin
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "while [ ! -f vendor/autoload.php ]; do sleep 1; done && php artisan serve --host=0.0.0.0 --port=8000"]

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    command: ["sh", "-c", "while [ ! -d node_modules/vite ]; do sleep 1; done && pnpm dev --host 0.0.0.0"]

volumes:
  postgres_data:
  redis_data:
  vendor_data:
  node_modules_data:
