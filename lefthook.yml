pre-commit:
  parallel: true
  commands:
    pint:
      glob: '*.php'
      run: ./vendor/bin/sail bin pint {staged_files}
      stage_fixed: true
    phpstan:
      glob: '*.php'
      run: ./vendor/bin/sail bin phpstan analyse --no-progress {staged_files}
    eslint:
      glob: '*.{js,ts,vue}'
      run: ./vendor/bin/sail pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{css,json,md}'
      run: ./vendor/bin/sail pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typescript-transform:
      glob: '{app/Data/**,app/Enums/**}/*.php'
      run: ./vendor/bin/sail artisan typescript:transform && git add resources/js/types/generated.d.ts
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: ./vendor/bin/sail pnpm exec vue-tsc --noEmit
